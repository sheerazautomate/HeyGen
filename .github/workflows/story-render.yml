name: Story render

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: story-render-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event.issue && !github.event.issue.pull_request && startsWith(github.event.comment.body, '/render') }}
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.prep.outputs.ok }}
    steps:
      - name: Only collaborators can trigger renders
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROLE=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.event.comment.user.login }}/permission" --jq .permission 2>/dev/null || echo none)
          case "$ROLE" in
            admin|write|maintain) echo "Authorized ($ROLE)" ;;
            *) echo "::error::@${{ github.event.comment.user.login }} is not a collaborator ($ROLE)"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Find the storyboard packet on this issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/story
          python3 scripts/story/story.py find-story \
            --issue ${{ github.event.issue.number }} > build/story/packet.txt

      - name: No storyboard yet? Say so instead of failing silently
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "I can't find a storyboard on this issue yet. The analyzer may have failed or it's still running -" \
            "check the comments above. To (re)generate the storyboard, comment: \`/story\`" > build/story/error.md
          python3 scripts/story/story.py post --issue ${{ github.event.issue.number }} --body build/story/error.md
          exit 1

      - name: Prepare render request from the story script
        id: prep
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          # lets story/product.py read the target repo's description and topics
          # when a /render command regenerates the script
          GH_TOKEN: ${{ github.token }}
          STORY_PROVIDER: ${{ vars.STORY_PROVIDER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if python3 scripts/story/story.py prepare \
              --packet build/story/packet.txt \
              --comment "$COMMENT_BODY" \
              --out build/request 2>&1 | tee build/story/prepare.log; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bad command? Explain the syntax instead of failing silently
        if: steps.prep.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "😕 I couldn't prepare that render:"; echo; \
            echo '```'; grep -o '::error::.*' build/story/prepare.log | sed 's/::error:://' | tail -n 3; echo '```'; \
            echo; echo "Try \`/render\` on its own, or see the storyboard comment for the full command list."; \
          } > build/story/error.md
          python3 scripts/story/story.py post --issue ${{ github.event.issue.number }} --body build/story/error.md || true
          exit 1

      - name: Acknowledge the render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "🎬 Rendering now - full-throttle pipeline in the sandbox." \
            "" "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > build/story/ack.md
          python3 scripts/story/story.py post --issue ${{ github.event.issue.number }} --body build/story/ack.md || true

      - name: Upload the prepared request
        uses: actions/upload-artifact@v4
        with:
          name: story-request-${{ github.event.issue.number }}
          path: build/request
          retention-days: 1

  core:
    needs: prepare
    if: ${{ needs.prepare.result == 'success' }}
    uses: ./.github/workflows/render-core.yml
    with:
      issue_number: ${{ github.event.issue.number }}
      request_artifact: story-request-${{ github.event.issue.number }}
    secrets: inherit
