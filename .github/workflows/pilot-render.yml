name: Create personal pro video
run-name: "Pro video request #${{ github.event.issue.number }}"

on:
  issues:
    types: [opened]

permissions: {}
concurrency:
  group: pilot-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      accepted: ${{ steps.request.outputs.accepted }}
      issue: ${{ steps.request.outputs.issue }}
      comment: ${{ steps.request.outputs.comment }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check personal access and composition (pro limits)
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pilot/admit.py

      - uses: actions/upload-artifact@v4
        if: steps.request.outputs.accepted == 'true'
        with:
          name: pilot-request
          path: build/request/
          retention-days: 7
          if-no-files-found: error

  core:
    needs: admit
    if: needs.admit.outputs.accepted == 'true'
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/render-core.yml
    with:
      artifact_name: pilot-request
