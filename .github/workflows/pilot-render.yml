name: Create personal pro video
run-name: "Pro video request #${{ github.event.issue.number }}"

on:
  issues:
    types: [opened]

permissions: {}
concurrency:
  group: pilot-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      accepted: ${{ steps.request.outputs.accepted }}
      issue: ${{ steps.request.outputs.issue }}
      comment: ${{ steps.request.outputs.comment }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check personal access and composition (pro limits)
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pilot/admit.py

      - uses: actions/upload-artifact@v4
        if: steps.request.outputs.accepted == 'true'
        with:
          name: pilot-request
          path: build/request/
          retention-days: 7
          if-no-files-found: error

  render:
    needs: admit
    if: needs.admit.outputs.accepted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: pilot-request
          path: build/request

      - name: Build pro renderer with network access (before executing upload)
        run: docker build -t pilot-renderer scripts/pilot

      - name: Render with full throttle (network, 4 CPUs, 8GB, up to 10 min, 4K/60fps/high)
        timeout-minutes: 20
        run: bash scripts/pilot/run_sandbox.sh

      - name: Always stop the sandbox
        if: always()
        run: docker rm -f pilot-sandbox >/dev/null 2>&1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: pilot-media
          path: build/media/
          retention-days: 7
          if-no-files-found: error

  creating:
    needs: admit
    if: needs.admit.outputs.accepted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - env:
          GH_TOKEN: ${{ github.token }}
          PILOT_COMMENT: ${{ needs.admit.outputs.comment }}
          PILOT_STATUS: creating
        run: python3 scripts/pilot/status.py

  publish:
    needs: [admit, render, creating]
    if: ${{ !cancelled() && needs.admit.outputs.accepted == 'true' && needs.render.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: pilot-request
          path: build/request

      - uses: actions/download-artifact@v4
        with:
          name: pilot-media
          path: build/media

      - name: Publish pro video and update its request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pilot/publish.py

  failure:
    needs: [admit, render, creating, publish]
    if: ${{ always() && needs.admit.outputs.accepted == 'true' && needs.publish.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - env:
          GH_TOKEN: ${{ github.token }}
          PILOT_COMMENT: ${{ needs.admit.outputs.comment }}
          PILOT_STATUS: failed
        run: python3 scripts/pilot/status.py
