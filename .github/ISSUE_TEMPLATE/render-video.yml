name: Create a video
description: Submit the request copied from HyperFrames Studio. A GitHub account and pilot approval are required.
title: "[Video] My video"
body:
  - type: markdown
    attributes:
      value: |
        ## One last step
        Paste the request you copied from the studio below, then click **Create**.
        Your request, HTML, and finished video will be **public**. Do not include secrets or personal information.
        Only approved pilot users can render. Ask the repository owner for access before submitting.
        After submitting, copy this issue's URL back into the studio to watch progress.
  - type: textarea
    id: request
    attributes:
      label: Render request
      description: Paste the entire request beginning HF1. from the studio. No need to edit or understand it.
      placeholder: HF1.eyJ...
      render: text
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Public sharing
      options:
        - label: I understand that my HTML and video will be public, and I have the rights to publish them.
          required: true
