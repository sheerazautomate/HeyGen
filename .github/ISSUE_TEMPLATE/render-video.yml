name: Create a pro video
description: Submit the request copied from your personal HyperFrames Studio. Private repo, full throttle.
title: "[Video] My pro video"
body:
  - type: markdown
    attributes:
      value: |
        ## Pro render - full throttle
        Paste the request you copied from your personal studio below, then click **Create**.
        Your video will be stored as a **private release** in this repo (since repo is private).
        Pro limits: up to 10MB HTML, up to 10 minutes, up to 4K (4096px), 60fps, high quality, MP4/WebM/MOV.
        External assets (images, fonts, audio, video) are now allowed via network.
        After submitting, copy this issue's URL back into the studio to watch progress.
  - type: textarea
    id: request
    attributes:
      label: Render request
      description: Paste the entire request beginning HF1. from the personal studio. Includes your quality/fps/format/variables settings.
      placeholder: HF1.eyJ...
      render: text
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Private use confirmation
      options:
        - label: I understand this is a private render for my own projects and I have the rights to use the content.
          required: true
